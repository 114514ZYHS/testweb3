<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烤鸡（整活） - 工具箱 - ZYHS</title>
<link rel="stylesheet" href="/theme.css">
<style>
body { max-width: 640px; margin: 40px auto; padding: 0 20px; }
.oven {
  margin-top: 8px; text-align: center;
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 36px 20px 28px; position: relative; overflow: hidden;
}
.chicken {
  font-size: 120px; line-height: 1; cursor: pointer; user-select: none;
  transition: transform .12s ease; display: inline-block; filter: drop-shadow(0 14px 22px rgba(0,0,0,.5));
}
.chicken:active { transform: scale(0.92) rotate(-4deg); }
.heat { font-size: 24px; height: 30px; margin-top: 6px; letter-spacing: 2px; }
.meter { height: 16px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin: 18px 0 8px; border: 1px solid var(--border); }
.fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #f43f5e); transition: width .2s ease; }
.stage { font-size: 20px; font-weight: 700; margin-top: 10px; color: var(--text); }
.status { color: var(--muted); font-size: 15px; margin-top: 6px; min-height: 22px; line-height: 1.6; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 14px; color: #fff; background: var(--accent); border: 1px solid var(--border); padding: 10px 22px; border-radius: 12px; cursor: pointer; transition: transform .15s, background .2s; }
.btn:hover { transform: translateY(-2px); background: var(--accent-2); }
.btn.ghost { background: rgba(255,255,255,.06); }
.count { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }
.count b { color: var(--text); font-size: 18px; }
.note { margin-top: 22px; padding: 12px 16px; border: 1px solid var(--border); border-left: 3px solid var(--accent-2); background: var(--glass); border-radius: 0 14px 14px 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--text); }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.spark { position: absolute; font-size: 22px; pointer-events: none; animation: rise2 .8s ease-out forwards; }
@keyframes rise2 { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-120px) scale(1.6); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .chicken:active { transform: none; } }
</style>
</head>
<body>
<a href="index.html" class="back-link">← 返回工具箱</a>
<h1>烤鸡（整活）</h1>
<div class="sub">纯解压小玩具 · 点一下把鸡烤一烤 · 致敬那些年一起点的毒蘑菇</div>

<div class="oven" id="oven">
  <div class="chicken" id="chicken" role="button" tabindex="0" aria-label="点我烤鸡">🍗</div>
  <div class="heat" id="heat"></div>
  <div class="meter"><div class="fill" id="fill"></div></div>
  <div class="stage" id="stage">生肉一块</div>
  <div class="status" id="status">这鸡还是凉的，点它！</div>
</div>

<div class="count">已烤 <b id="count">0</b> 下</div>

<div class="row">
  <button class="btn" id="roast">加一把火 🔥</button>
  <button class="btn ghost" id="reset">重新来过</button>
</div>

<div class="note">
  <b>说明：</b>本页纯本地运行，没有任何实际功能，就是图一乐。别在真锅里这么烤，会糊的。
</div>

<div class="footer">ye1.cc.cd · ZYHS</div>

<script>
(function(){
  "use strict";
  var heat = 0, count = 0;
  var chicken = document.getElementById('chicken');
  var fill = document.getElementById('fill');
  var stageEl = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var heatEl = document.getElementById('heat');
  var countEl = document.getElementById('count');
  var oven = document.getElementById('oven');

  var STAGES = [
    { min: 0,   emoji:'🥩', name:'生肉一块',  text:'这鸡还是凉的，点它！' },
    { min: 1,   emoji:'🔥', name:'微微受热',  text:'表皮开始冒油了，有内味儿了…' },
    { min: 35,  emoji:'🍗', name:'半生不熟',  text:'差不多了，再等等，里面还红着呢。' },
    { min: 65,  emoji:'😋', name:'金黄酥脆',  text:'完美！外焦里嫩，教科书级别的烤鸡。' },
    { min: 88,  emoji:'⚠️', name:'快糊了',    text:'快停手！再烤就成炭了！' },
    { min: 100, emoji:'💀', name:'烤成炭了',  text:'完蛋，这鸡已经成精了（炭精）。' }
  ];

  function spark(){
    var s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['🔥','✨','💥','🌶️'][Math.floor(Math.random()*4)];
    s.style.left = (30 + Math.random()*40) + '%';
    s.style.top = '40%';
    oven.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 800);
  }

  function render(){
    heat = Math.max(0, Math.min(120, heat));
    fill.style.width = Math.min(100, heat) + '%';
    countEl.textContent = count;
    var st = STAGES[0];
    for (var i=0;i<STAGES.length;i++){ if (heat >= STAGES[i].min) st = STAGES[i]; }
    chicken.textContent = st.emoji;
    stageEl.textContent = st.name;
    statusEl.textContent = st.text;
    var bars = '';
    for (var b=0;b<Math.min(10, Math.floor(heat/10)); b++) bars += '🔥';
    heatEl.textContent = bars;
    if (heat >= 100){ oven.classList.add('shake'); }
    else { oven.classList.remove('shake'); }
  }

  function roast(){
    heat += 4 + Math.floor(Math.random()*4);
    count++;
    spark();
    render();
  }

  chicken.addEventListener('click', roast);
  chicken.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); roast(); } });
  document.getElementById('roast').addEventListener('click', roast);
  document.getElementById('reset').addEventListener('click', function(){
    heat = 0; count = 0; oven.classList.remove('shake'); render();
  });

  render();
})();
</script>
</body>
</html>
